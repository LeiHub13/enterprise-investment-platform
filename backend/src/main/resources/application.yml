spring:
  application:
    name: enterprise-investment
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/enterprise_db?characterEncoding=UTF-8&connectTimeout=5000}
    username: ${MYSQL_USER:enterprise}
    password: ${MYSQL_PASSWORD:enterprise_dev_password}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
