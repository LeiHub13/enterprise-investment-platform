name: enterprise-resource

services:
  mysql:
    image: mysql:8.4
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: enterprise_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-enterprise_dev_root_password}
      MYSQL_USER: ${MYSQL_USER:-enterprise}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enterprise_dev_password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/enterprise_db.sql:/docker-entrypoint-initdb.d/01-enterprise_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-agent_checkpoints}
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-agent_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${AGENT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-enterprise}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio:
    profiles: ["storage"]
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-enterprise}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  business-api:
    profiles: ["app"]
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/enterprise_db?characterEncoding=UTF-8&connectTimeout=5000
      MYSQL_USER: ${MYSQL_USER:-enterprise}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enterprise_dev_password}
      SERVER_ADDRESS: 0.0.0.0
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_CONTACT_ENCRYPTION_KEY: ${APP_CONTACT_ENCRYPTION_KEY:-}
      APP_OPENAPI_ENABLED: ${APP_OPENAPI_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      AGENT_BASE_URL: http://agent:8766
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  agent:
    profiles: ["app"]
    build: ./agent
    environment:
      BUSINESS_BASE_URL: http://business-api:8080
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AGENT_CHECKPOINT_POSTGRES_URI: ${AGENT_CHECKPOINT_POSTGRES_URI:-}
      AGENT_POSTGRES_HOST: postgres
      AGENT_POSTGRES_USER: ${AGENT_POSTGRES_USER:-agent}
      AGENT_POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-agent_dev_password}
      AGENT_POSTGRES_DB: ${AGENT_POSTGRES_DB:-agent_checkpoints}
      AGENT_SCORE_WEIGHTS: ${AGENT_SCORE_WEIGHTS:-}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_WEB_PORT:-8088}:80"
    depends_on:
      business-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  collector-monitor:
    profiles: ["collector"]
    image: enterprise-resource-collector:latest
    build: ./collector
    environment:
      BUSINESS_BASE_URL: http://business-api:8080
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
      QCC_APP_KEY: ${QCC_APP_KEY:-}
      QCC_SECRET_KEY: ${QCC_SECRET_KEY:-}
      QCC_VERIFY_ON_MONITOR: ${QCC_VERIFY_ON_MONITOR:-false}
      COLLECTOR_SKIP_ENV_FILE: "1"
      TZ: Asia/Shanghai
    command: ["python", "-m", "collector.monitor", "--watch"]
    depends_on:
      business-api:
        condition: service_healthy

  collector-publisher:
    profiles: ["collector"]
    image: enterprise-resource-collector:latest
    environment:
      BUSINESS_BASE_URL: http://business-api:8080
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-enterprise}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      COLLECTOR_SKIP_ENV_FILE: "1"
      TZ: Asia/Shanghai
    command: ["python", "-m", "collector.events.publisher", "--watch"]
    depends_on:
      business-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  collector-consumer:
    profiles: ["automation"]
    image: enterprise-resource-collector:latest
    environment:
      BUSINESS_BASE_URL: http://business-api:8080
      AGENT_EVENT_API_TOKEN: ${AGENT_EVENT_API_TOKEN:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-enterprise}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      COLLECTOR_SKIP_ENV_FILE: "1"
      TZ: Asia/Shanghai
    command: ["python", "-m", "collector.events.consumer", "--watch"]
    depends_on:
      business-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  agent_postgres_data:
  rabbitmq_data:
  minio_data:
