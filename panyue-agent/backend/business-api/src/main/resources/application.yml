spring:
  application:
    name: panyue-business-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/panyue_agent?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${MYSQL_USER:panyue}
    password: ${MYSQL_PASSWORD:}
    hikari:
      connection-timeout: 3000

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
